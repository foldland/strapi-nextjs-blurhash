# Dependency age
minimumReleaseAge: 4320 # 3 days - same as renovate
minimumReleaseAgeExclude:
  - "@foldland/*"
  - "@strapi/*"
  # security issues
  - vite@6.4.3
  - sharp@0.35.0

registries:
  default: https://registry.npmjs.org/
  "@foldland": https://npm.registry.foldland.io/

# Dependency resolution
savePrefix: "^"
resolutionMode: "highest"
strictPeerDependencies: true
preferFrozenLockfile: true

# node version
engineStrict: true
ignorePnpmfile: true
# pnpm version
packageManagerStrict: true
packageManagerStrictVersion: true

# Security
blockExoticSubdeps: true
hoist: false
hoistWorkspacePackages: false
verifyDepsBeforeRun: "install"

# broken strapi peers
peerDependencyRules:
  allowedVersions:
    codemirror: 5.65.21
    zod: 3.25.67

overrides:
  sharp@<0.35.0: ^0.35.0
  vite@<=6.4.2: ^6.4.3

allowBuilds:
  "@swc/core": false
  core-js-pure: false
  esbuild: false
  sharp: false
