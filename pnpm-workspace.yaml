#minimumReleaseAge: 4320 # 3 days - same as renovate
minimumReleaseAgeExclude:
  - "@debacode-public/*"

# Dependency resolution
savePrefix: ""
resolutionMode: "highest"
strictPeerDependencies: true
preferFrozenLockfile: true

# node version
useNodeVersion: 22.0.0
engineStrict: true
ignorePnpmfile: true
# pnpm version
packageManagerStrict: true
packageManagerStrictVersion: true

# Security
blockExoticSubdeps: true
hoist: false
hoistWorkspacePackages: false
verifyDepsBeforeRun: "install"

overrides:
  # broken strapi peers
  # https://github.com/strapi/strapi/issues/21201
  typescript@5.3.x: ^5.3.0
  zod@3.25.67: ^3.25.76
  # security issues
  ajv@>=7.0.0-alpha.0 <8.18.0: "^8.18.0"
  esbuild@<=0.24.2: "^0.25.0"
  koa@<2.16.4: "^2.16.4"
  markdown-it@>=13.0.0 <14.1.1: "^14.1.1"
  minimatch@>=10.0.0 <10.2.3: "^10.2.3"
  tar@<=7.5.9: "^7.5.10"
  tmp@<=0.2.3: "^0.2.4"
