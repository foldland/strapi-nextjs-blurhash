# Dependency age
minimumReleaseAge: 4320 # 3 days - same as renovate
minimumReleaseAgeExclude:
  - "@debacode-public/*"
  - "@debacode/*"
  - "@foldland/*"
  - axios@1.15.2
  - fast-uri@3.1.2
  - lodash@4.17.24

# Dependency resolution
savePrefix: "^"
resolutionMode: "highest"
strictPeerDependencies: true
preferFrozenLockfile: true

# node version
engineStrict: true
ignorePnpmfile: true
# pnpm version
packageManagerStrict: true
packageManagerStrictVersion: true

# Security
blockExoticSubdeps: true
hoist: false
hoistWorkspacePackages: false
verifyDepsBeforeRun: "install"

overrides:
  # broken strapi peers
  # https://github.com/strapi/strapi/issues/21201
  typescript@5.3.x: ^5.3.0
  zod@3.25.67: ^3.25.76
  # security issues
  axios@>=1.0.0 <1.15.2: ^1.15.2
  fast-uri@<=3.1.1: ^3.1.2
  lodash@>=4.0.0 <=4.17.23: ^4.17.24

allowBuilds:
  "@swc/core": false
  core-js-pure: false
  esbuild: false
  sharp: false
