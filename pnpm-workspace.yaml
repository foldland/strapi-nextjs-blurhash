# Dependency age
minimumReleaseAge: 4320 # 3 days - same as renovate
minimumReleaseAgeExclude:
  - "@foldland/*"
  - "@strapi/*"
  - lodash@4.17.24
  - ws@8.21.0
  - vite@6.4.3
  - nodemailer@9.0.1
  - undici@6.27.0

registries:
  default: https://registry.npmjs.org/
  "@foldland": https://npm.registry.foldland.io/

# Dependency resolution
savePrefix: "^"
resolutionMode: "highest"
strictPeerDependencies: true
preferFrozenLockfile: true

# node version
engineStrict: true
ignorePnpmfile: true
# pnpm version
packageManagerStrict: true
packageManagerStrictVersion: true

# Security
blockExoticSubdeps: true
hoist: false
hoistWorkspacePackages: false
verifyDepsBeforeRun: "install"

overrides:
  zod@3.25.67: ^3.25.76
  # security issues
  lodash@>=4.0.0 <=4.17.23: ^4.17.24
  nodemailer@<=9.0.0: ^9.0.1
  undici@<6.27.0: ^6.27.0
  vite@<=6.4.2: ^6.4.3
  ws@>=8.0.0 <8.21.0: ^8.21.0

allowBuilds:
  "@swc/core": false
  core-js-pure: false
  esbuild: false
  sharp: false
